# Nginx：托管 Vite 产物，并把 /api、/tiles 反代到后端容器
# 为什么不直连 8080：容器内网用服务名 backend 解析，前端只暴露一个 80 端口。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip：geomv/mvt 已由后端压缩过，这里只压文本资源
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cesium 静态资源（vite-plugin-cesium 产物在 dist/cesium 下），带 hash 的 assets 长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /cesium/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 空间数据接口
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # MVT 矢量瓦片：后端已设置 Content-Type: application/x-protobuf，这里原样透传
    location /tiles/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "public, max-age=3600";
    }

    # Swagger（便于在容器里直接看接口文档）
    location /swagger-ui/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /v3/api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
