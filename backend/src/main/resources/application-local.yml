# ============================================================
# 本地开发环境配置（默认激活）
# ============================================================
#
# 数据库连接全部走环境变量，并给出本地开发用的默认值，
# 这样：
#   · 本机开发零配置即可启动（默认值就是本地 postgres）；
#   · 换机器 / 换库只需设环境变量，不必改代码；
#   · 仓库里不再出现真实口令。
#
# 可通过环境变量覆盖：
#   DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD
#
# 本文件会随仓库公开，因此不写入任何真实口令，
# 只留占位符；本地开发请通过环境变量 DB_PASSWORD 提供。

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shp_data}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# 本地开发：清理默认不开（见 application.yml 的说明），需要时设
#   CAMPUS_CLEANUP_ENABLED=true
campus:
  cleanup:
    enabled: ${CAMPUS_CLEANUP_ENABLED:false}

logging:
  level:
    com.campus.twin: debug
    org.springframework.web: info
