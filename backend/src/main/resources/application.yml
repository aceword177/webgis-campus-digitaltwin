server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: campus-digital-twin
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/shp_data
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.campus.twin.entity
  configuration:
    map-underscore-to-camel-case: true
    # 不打印每条 SQL（原 StdOutImpl 会把 Preparing/Parameters/Row 全部刷到控制台，
    # 叠加定时任务后终端刷屏，易误判为启动失败/死循环）；需要排查时再临时打开
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      table-underline: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.campus.twin: info
    org.springframework.web: info
