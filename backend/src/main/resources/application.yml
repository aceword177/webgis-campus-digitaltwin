server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: campus-digital-twin
  # 默认激活 local profile；可用 --spring.profiles.active=prod 覆盖
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    property-naming-strategy: SNAKE_CASE

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.campus.twin.entity
  configuration:
    map-underscore-to-camel-case: true
    # 不打印每条 SQL（原 StdOutImpl 会把 Preparing/Parameters/Row 全部刷到控制台，
    # 叠加定时任务后终端刷屏，易误判为启动失败/死循环）；需要排查时再临时打开
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      table-underline: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # 生产环境默认关闭（见 application-prod.yml），避免接口文档对外暴露
    enabled: true

# ===== 业务开关 =====
campus:
  cleanup:
    # 启动时是否执行历史脏数据清理（DataCleanupRunner）。
    # 默认 false：该清理会改写业务数据（把超期配送中订单置为 cancelled、
    # 修正航线与无人机状态、把空闲无人机挪回食堂），属破坏性操作，
    # 不应在每次启动时无条件执行。需要时显式改为 true。
    enabled: ${CAMPUS_CLEANUP_ENABLED:false}

logging:
  level:
    com.campus.twin: info
    org.springframework.web: info
